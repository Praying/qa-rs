[package]
name = "qa-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

serde_json = "1.0.73"
serde_derive = "1.0"
serde = { version = "1.0", features = ["derive"] } # 序列化

stopwatch = "0.0.7"


uuid = { version = "0.8", features = ["serde", "v1", "v4"] }
log = "0.4"
regex = "1"
log4rs = "0.13"

rayon ="1.5"
lazy_static = "1.4.0"

reqwest = "0.9.22"
csv = "1.1.3"
clap = "2.33"
toml = "0.5"
redis = "0.18.0"
amiquip = "0.4.0"
hashbrown = {version="0.12", features=['serde', 'rayon']}

bson = "0.13.0"
queues = "1.0.2"

redis-async = {version = "0.8", default-features = false, features = ["tokio10"] }
actix-web-actors = { version = "4.1", default-features = false }
actix-redis = "0.10.0-beta.4"
actix = "0.13"
actix-rt = "2.5.0"
actix-broker = "0.4.2"
actix-files = "0.6"
env_logger = "0.9"
actix-cors = "0.6.0-beta.7"
actix-web = "4"
mongodb = {version = "2", default-features = false, features = ["tokio-sync", "bson-serde_with", "bson-chrono-0_4"] }

mimalloc = { version = "*", default-features = false }
futures="0.3.5"
futures-executor = "^0.3"
futures-test = "^0.3"
futures-util = "^0.3"
async-trait= "0.1.52"
chrono-tz= { version = "0.5.3", features = ["serde"] }
chrono = { version = "0.4.19", features = ["serde"] }
pyo3 = { version = "0.17.3", features = ["hashbrown", "extension-module", "multiple-pymethods"] }
pyo3-chrono = "0.5.0"

thiserror = "1.0"
rand = "0.7"
quadprog = "0.0.1"
itertools = "0.10.3"
lmdb = "0.8.0"
sled = "0.34.7"
peroxide = "0.32.1"
#arrow2 = {version="0.14.2", features=["full"]}
async_once = "0.2.6"
[dependencies.polars-lazy]
git = "https://github.com/yutiansut/polars"
rev = "93771165397938c616a024f95c989cfafa10bdb3"

[dependencies.polars]
git = "https://github.com/yutiansut/polars"
rev = "93771165397938c616a024f95c989cfafa10bdb3"
default-features = false
features = [
  "parquet",
  "partition_by",

]
[lib]
name = "qa_rs"
crate-type = [ "cdylib", "rlib"]
[profile.release]
codegen-units = 1
lto = "fat"
